buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${kotlinVersion}")
  }
}

apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

group = 'app.toda.widgets'
version = '0.1.0'

// Expo Modules 2.0: annotated Kotlin classes, found at compile time rather than listed.
expoModule {
  v2 true
}

android {
  namespace "app.toda.widgets"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    consumerProguardFiles 'consumer-rules.pro'
  }
  buildFeatures {
    compose true
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  // Home screen widgets in Compose, with Material 3 widget components and dynamic colour.
  implementation 'androidx.glance:glance-appwidget:1.2.0'
  // The list widget's picker (TasksWidgetConfigureActivity), in the Compose and Material 3 that
  // @expo/ui is built against.
  implementation 'androidx.activity:activity-compose:1.10.1'
  implementation 'androidx.compose.foundation:foundation-android:1.12.1'
  implementation 'androidx.compose.material3:material3-android:1.5.0-beta01'
}
